services:
  flask:
    build: ./JDA-12
    ports:
      - "5000:5000"
    env_file: .env
    volumes:
      - ./JDA-12:/app
    depends_on:
      - db
    restart: unless-stopped

  data-api:
    build: ./JDA-12/data-API
    ports:
      - "4000:4000"
    env_file: .env
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: jda
      POSTGRES_USER: jda
      POSTGRES_PASSWORD: jda
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
